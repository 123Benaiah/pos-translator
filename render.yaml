# Render blueprint: backend API only (frontend deploys on Vercel via vercel.json).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pos-translator-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false # set in dashboard: mongodb+srv://...@cluster0.va72sde.mongodb.net/pos_translator
      - key: DB_NAME
        value: pos_translator
      - key: CORS_ORIGINS
        # Append your Vercel URL after the first frontend deploy,
        # e.g. https://pos-translator.vercel.app,http://localhost:5173
        value: https://pos-translator-three.vercel.app,http://localhost:5173
